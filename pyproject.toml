[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resident-runtime"
version = "0.1.0"
description = "A minimal persistent Resident runtime"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

