[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resident-runtime"
version = "0.1.0"
description = "A minimal persistent Resident runtime"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

